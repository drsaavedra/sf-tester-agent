<template>
    <!-- Quick action panel with a button that closes it -->
    <lightning-quick-action-panel header="SFUIC Close Action">
        <h3 class="slds-text-heading_small" data-id="close-action-screen-event">CloseActionScreenEvent</h3>
        <p>SFUIC Close fires CloseActionScreenEvent and the panel closes.</p>
        <div slot="footer">
            <lightning-button variant="brand" label="SFUIC Close" onclick={close}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
